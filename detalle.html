<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#f4f4f6] min-h-screen flex flex-col antialiased text-gray-800">

    <!-- Header / Barra de navegación -->
    <header class="w-full bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16 space-x-6 text-sm sm:text-base">
                <a href="#" class="text-[#0066ff] hover:underline font-normal transition-colors">Talleres</a>
                <a href="#" class="text-[#0066ff] hover:underline font-normal transition-colors">Iniciar sesión</a>
            </div>
        </div>
    </header>

    <!-- Contenido principal centrado -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-sm flex flex-col items-center">
            
            <h1 class="text-3xl font-bold text-black mb-8 text-center tracking-tight">
                Iniciar sesión
            </h1>

            <form class="w-full space-y-4" onsubmit="event.preventDefault();">
                <div>
                    <label for="correo" class="sr-only">Correo</label>
                    <input 
                        type="email" 
                        id="correo" 
                        name="correo" 
                        placeholder="Correo"
                        class="w-full px-3.5 py-2.5 bg-white border border-gray-300 rounded-md text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0066ff] focus:border-transparent text-sm transition-all"
                        required
                    >
                </div>

                <div>
                    <label for="password" class="sr-only">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Contraseña"
                        class="w-full px-3.5 py-2.5 bg-white border border-gray-300 rounded-md text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0066ff] focus:border-transparent text-sm transition-all"
                        required
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-[#0066ff] hover:bg-[#0052cc] text-white font-medium py-2.5 px-4 rounded-md text-sm shadow-sm transition-colors duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0066ff]"
                >
                    Entrar
                </button>
            </form>
            
        </div>
    </main>

</body>
</html>
